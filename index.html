<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#160d2b">
<title>Happy Birthday — Початок 🎂</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 45%,#21132f 0%,#090710 58%,#000 100%);color:#fff;font-family:system-ui,sans-serif}.card{width:min(520px,100%);padding:clamp(26px,6vw,44px);text-align:center;border:1px solid #ffffff25;border-radius:28px;background:#ffffff0d;box-shadow:0 24px 80px #0009;backdrop-filter:blur(12px)}.cake{font-size:clamp(110px,28vw,190px);line-height:1.2;filter:drop-shadow(0 0 28px #ff9bc955);animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-12px) rotate(2deg)}}h1{font-size:clamp(2rem,8vw,3.5rem);margin:12px 0;background:linear-gradient(90deg,#ffe2a8,#ff9ed1,#c8a7ff);color:transparent;background-clip:text}.desc{color:#d9cbe8;line-height:1.7;margin:0 auto 26px;max-width:390px}.start{border:0;border-radius:999px;padding:15px 28px;font-size:1.05rem;font-weight:800;color:#32152e;background:linear-gradient(100deg,#ffb56b,#ff79b7);cursor:pointer;box-shadow:0 8px 28px #ff79b744}.start:active{transform:scale(.97)}
</style>
</head>
<body>
<main class="card">
<div class="cake">🎂</div>
<h1>Happy Birthday!</h1>
<p class="desc">На тебе чекає маленька святкова пригода. Спочатку підготуй усе до свята, а потім відкрий привітання!</p>
<button class="start" type="button" onclick="location.href='game.html'">🎉 Почати свято</button>
</main>
</body>
</html>
